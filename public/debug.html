<!doctype html>
<html><head><meta charset="utf-8"><title>debug</title></head>
<body>
<script>
const f = document.createElement('iframe');
f.src = '/';
f.style.cssText = 'width:390px;height:844px;border:0';
document.body.appendChild(f);
f.onload = () => {
  setTimeout(() => {
    const d = f.contentDocument;
    const w = f.contentWindow;
    const q = s => d.querySelector(s);
    const cs = el => el ? getComputedStyle(el) : null;
    const rect = el => el ? el.getBoundingClientRect().toJSON() : null;
    const ha = q('.header-actions');
    const menu = q('.menu');
    const wrap = q('.header .wrap');
    const hero = q('.hero');
    const lead = q('.hero .lead');
    const nav = q('.nav');
    const out = {
      innerWidth: w.innerWidth,
      docClientWidth: d.documentElement.clientWidth,
      bodyScrollWidth: d.body.scrollWidth,
      headerActionsDisplay: cs(ha)?.display,
      headerActionsRect: rect(ha),
      menuDisplay: cs(menu)?.display,
      menuRect: rect(menu),
      wrapRect: rect(wrap),
      wrapDisplay: cs(wrap)?.display,
      heroPadding: cs(hero)?.padding,
      leadWidth: rect(lead)?.width,
      leadScrollWidth: lead?.scrollWidth,
      navDisplay: cs(nav)?.display,
      navPosition: cs(nav)?.position
    };
    document.body.textContent = JSON.stringify(out, null, 2);
  }, 500);
};
</script>
</body></html>
